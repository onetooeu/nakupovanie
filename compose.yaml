services:
  postgres:
    image: postgres:18.1-alpine
    container_name: nakupovanie-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nakupovanie}
      POSTGRES_USER: ${POSTGRES_USER:-nakupovanie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - nakupovanie-postgres-data:/var/lib/postgresql

volumes:
  nakupovanie-postgres-data:
